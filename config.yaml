# ─── LinkedIn Easy Apply Bot – Configuration ───
# Credentials (you can also load them from environment variables / .env)
username: ""
password: ""

positions:
  # Software & Web Engineering
  - Software Engineer
  - Software Developer
  - Software Engineering Intern
  - Junior Software Engineer
  - Associate Software Engineer
  - Python Developer
  - Python Engineer
  - Backend Developer
  - Backend Engineer
  - Full Stack Developer
  - Full Stack Engineer
  - Frontend Developer
  - Web Developer
  - Web Development Intern
  - Graduate Software Engineer
  # Data, Analytics, Scraping & ETL
  - Data Analyst
  - Data Analyst Intern
  - Junior Data Analyst
  - Data Engineer
  - Data Engineering Intern
  - Data Science Intern
  - Web Scraping Specialist
  - Data Scraping Intern
  - ETL Developer
  # AI, ML & NLP
  - AI Engineer
  - AI Intern
  - Machine Learning Engineer
  - Machine Learning Intern
  - AI / ML Engineer
  - Generative AI Engineer
  - NLP Engineer
  - LLM Engineer
  # Automation, Security & IT
  - Automation Engineer
  - QA Automation Intern
  - QA Engineer
  - Cybersecurity Intern
  - Security Analyst Intern
  - Information Security Analyst
  - SOC Analyst Intern
  - Technical Support Intern
  - IT Support Intern
  - IT Intern
  # Finance, FinTech & Analytics
  - Financial Analyst
  - Financial Analyst Intern
  - Finance Intern
  - Investment Banking Intern
  - Quantitative Analyst Intern
  - FinTech Intern

locations:
  - Remote
  - Mumbai
  - India
  - Bengaluru

# Search Filters
# date_posted: past_24h | past_week | past_month | all
date_posted: "past_week"

# workplace_types: remote | hybrid | onsite
workplace_types:
  - remote
  - hybrid

# job_types: full_time | contract | part_time | internship
job_types:
  - internship
  - full_time
  - contract

# Maximum number of applications to submit per session (0 = unlimited)
max_applications: 0

# Multi-Resume mapping (selects matching resume by job title keyword, falls back to Resume/default)
uploads:
  Resume: "resumes/resume.pdf"
  # data: "resumes/data_engineer_resume.pdf"
  # python: "resumes/python_resume.pdf"
  # "Cover Letter": "resumes/cover_letter.pdf"

# Runtime Flags
dry_run: false
headless: false
user_data_dir: ""
proxy: ""

max_pages_per_search: 3

# Session pacing (how long the bot runs and takes breaks)
session_duration_hours_min: 2
session_duration_hours_max: 4
short_break_min_seconds: 15
short_break_max_seconds: 45
short_break_every_min_minutes: 30
short_break_every_max_minutes: 60
shuffle_search_combos: false

# ─── Title Blacklist ───
# If any of these words or phrases appear in the job title, the bot will automatically skip the job.
# This prevents applying to non-technical, sales, operations, founder's office, marketing, or unrelated roles.
blacklist_titles:
  # Executive, Founder's Office & Strategy
  - "founder's office"
  - "founders office"
  - "founder office"
  - "founding intern"
  - "chief of staff"
  - "strategy intern"
  - "strategic intern"
  - "operations & strategy"
  - "operations and strategy"
  - "business operations"
  - "bizops"
  - "general management"
  - "management trainee"
  - "executive assistant"

  # Business Development, Sales & Outreach
  - "business development"
  - "bde"
