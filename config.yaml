  - "Frontend Developer"
  - "Node.js Developer"
  - "Application Developer"
  - "Junior Developer"

  # --- Data Scraping, Engineering & Analytics (Resume: Data Scraping Internship, SQL, Cleaning, Excel) ---
  - "Data Analyst"
  - "Data Engineer"
  - "Data Scraping"
  - "Web Scraping"
  - "ETL Developer"
  - "Business Analyst"
  - "Research Analyst"
  - "BI Analyst"

  # --- IT Support & Systems (Resume: 2 IT Internships, SIEM, Ticket Management, Network Monitoring) ---
  - "IT Support"
  - "Technical Support"
  - "IT Analyst"

  # --- AI, Machine Learning & NLP (Resume: Sentinel Verify ML Pipeline, Hackathon RAG Agent) ---
  - "AI Engineer"
  - "Machine Learning"
  - "NLP Engineer"
