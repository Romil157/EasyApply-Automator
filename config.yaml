  - "QA Engineer"
  - "DevOps Engineer"

  # --- Finance & Growth Analytics (User-Requested Domain Focus) ---
  - "Financial Analyst"
  - "SEO Intern"
  - "SEM Specialist"

locations:
  - Remote
  - Mumbai
  - India
  - Bengaluru
  - Pune
  - Hyderabad
  - Gurugram
  - Noida

# Search Filters
# date_posted: past_24h | past_week | past_month | all
date_posted: "past_week"

# workplace_types: remote | hybrid | onsite
workplace_types:
  - remote
  - hybrid
  - onsite

# job_types: full_time | contract | part_time | internship
job_types:
  - internship
  - full_time
  - contract

# Maximum number of applications to submit per session (0 = unlimited)
max_applications: 0

# Multi-Resume mapping (selects matching resume by job title keyword, falls back to Resume/default)
uploads:
  Resume: "resumes/resume.pdf"
  # data: "resumes/data_engineer_resume.pdf"
  # python: "resumes/python_resume.pdf"
  # "Cover Letter": "resumes/cover_letter.pdf"

# Runtime Flags
dry_run: false
headless: false
user_data_dir: ""
proxy: ""

max_pages_per_search: 5

# Session pacing (how long the bot runs and takes breaks)
session_duration_hours_min: 2
session_duration_hours_max: 4
short_break_min_seconds: 15
short_break_max_seconds: 45
short_break_every_min_minutes: 30
short_break_every_max_minutes: 60
shuffle_search_combos: true

# ─── Title Blacklist ───
# If any of these words or phrases appear in the job title, the bot will automatically skip the job.
# This prevents applying to non-technical, sales, operations, marketing, or senior-level roles.
