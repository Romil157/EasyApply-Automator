    - "mongodb"
    - "redis"
    - "snowflake"
    - "bigquery"
    - "databricks"
    - "data warehouse"
    - "etl"
    - "data engineer"
    - "data engineering"
    - "dba"
    - "data platform"
    - "data architect"
  medical_related:
    - "medical"
    - "healthcare"
    - "health care"
    - "clinical"
    - "hospital"
    - "patient"
    - "pharma"
    - "pharmaceutical"
    - "biotech"
    - "biosciences"
    - "therapeutic"
    - "therapeutics"
    - "oncology"
    - "nurse"
    - "nursing"
    - "physician"
    - "dmpk"
    - "pharmacology"
    - "medtech"
    - "ehr"
    - "emr"
    - "life sciences"
    - "life science"
    - "mental health"
