locations:
  - Mumbai        # Primary Location (Local / Onsite / Hybrid in home city)
  - Remote        # Nationwide remote opportunities
  - India         # Broad India search for top matches
  - Bengaluru     # Primary Indian Tech Hub
  - Pune          # Nearby Maharashtra Tech Hub
  - Hyderabad
  - Gurugram
  - Noida

# Search Filters
# date_posted: past_24h | past_week | past_month | all
date_posted: "past_week"

# workplace_types: remote | hybrid | onsite
workplace_types:
  - remote
  - hybrid
  - onsite

# job_types: internship | full_time | contract | part_time
job_types:
  - internship
  - full_time
  - contract

# Experience level mapping:
# 1: Internship | 2: Entry level | 3: Associate | 4: Mid-Senior
experience_level:
  - 1  # Internship
  - 2  # Entry level

# Maximum number of applications to submit per session (0 = unlimited)
max_applications: 0

# Multi-Resume mapping (selects matching resume by job title keyword, falls back to Resume/default)
uploads:
  Resume: "resume.md"

# Runtime Flags
dry_run: false
headless: false
user_data_dir: ""
proxy: ""

max_pages_per_search: 5

# Session pacing (humanized pauses to protect account)
session_duration_hours_min: 2
session_duration_hours_max: 4
short_break_min_seconds: 15
short_break_max_seconds: 45
short_break_every_min_minutes: 30
short_break_every_max_minutes: 60
shuffle_search_combos: true

# ─── Title Blacklist ───
