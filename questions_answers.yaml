# ─── EasyApply Automator – Local Answer Profile (gitignored) ───────────────
# This file lives only on your local disk (gitignored). It holds the
# lower-sensitivity profile data that you chose to keep in YAML form:
# years of experience per skill, work-authorization answers, demographics,
# education, cover-letter pitch, etc.
#
# High-sensitivity PII (full name, phone, email, LinkedIn/GitHub URLs) is
# sourced from environment variables (see .env.example) and injected into
# rule answers via {placeholders} like {full_name}, {phone_number}. Leave
# those placeholders in place — the AutoAnswer engine resolves them at
# runtime from your .env. If an env var is missing, the literal {placeholder}
# stays in the answer as a visible signal to the user.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

defaults:
  unknown_years: "0"
  unknown_text: "user provided"
  yes: "Yes"
  no: "No"
  prefer_not: "Wish not to answer"
  no_self_id: "I do not wish to self-identify"

profile:
  years:
    overall_software: "2"
    ai_ml: "1"
    machine_learning: "1"
    deep_learning: "1"
    nlp: "1"
    llm_genai: "1"
    data_science: "1"
    data_engineering: "1"
    data_analysis: "1"
    data_scraping: "2"
    data_cleaning: "2"
    python: "2"
    sql: "2"
    backend: "2"
    frontend: "2"
    fullstack: "2"
    web_development: "2"
    html_css: "2"
    javascript: "2"
    nodejs: "1"
    react: "1"
    flask: "1"
    fastapi: "1"
    rest_apis: "2"
    git: "2"
    cybersecurity: "2"
    siem: "1"
    automation: "2"
    testing_qa: "1"
    technical_support: "1"
    networks: "1"
    excel: "2"
    linux: "2"
    docker: "1"
    leadership: "1"
    seo: "1"
    sem: "1"
    finance: "1"
    financial_analysis: "1"
    investment_banking: "1"

  work_auth:
    us_citizen: "No"
    require_sponsorship: "No"
    legally_authorized: "Yes"
    # LinkedIn profile URL sourced from LINKEDIN_PROFILE_URL env var; leave
    # blank here so the env value is the single source of truth.
    linkedin_profile_url: ""

  demographics:
    gender: "Male"
    race: "Asian"
    ethnicity: "Wish not to answer"
    lgbtq: "Wish not to answer"
    nationality: "Indian"
    government_id: "I do not wish to self-identify"

rules:
  - id: salary
    match_any:
      - "(?i)salary"
      - "(?i)compensation"
      - "(?i)desired salary"
      - "(?i)expected salary"
      - "(?i)base salary"
    answer: "{salary}"

  - id: hourly_rate
    match_any:
      - "(?i)hourly rate"
      - "(?i)rate per hour"
      - "(?i)contract rate"
      - "(?i)consulting rate"
    answer: "{hourly_rate}"

  - id: phone_number
    match_any:
      - "(?i)phone"
      - "(?i)mobile"
      - "(?i)contact number"
    answer: "{phone_number}"

  - id: email
    match_any:
      - "(?i)email"
      - "(?i)e-mail"
    answer: "{form_email}"

  - id: name
    match_any:
      - "(?i)full name"
      - "(?i)your name"
    answer: "{full_name}"

  - id: first_name
    match_any:
      - "(?i)first name"
    answer: "{first_name}"

  - id: last_name
    match_any:
      - "(?i)last name"
      - "(?i)surname"
    answer: "{last_name}"

  - id: city
    match_any:
      - "(?i)city"
      - "(?i)current location"
      - "(?i)where are you located"
      - "(?i)where are you based"
      - "(?i)where.*based"
      - "(?i)currently based"
      - "(?i)what is your location"
      - "(?i)current city"
    answer: "{location_city}"

  - id: address
    match_any:
      - "(?i)address"
      - "(?i)street"
    answer: "Mumbai, Maharashtra, India"

  - id: university
    match_any:
      - "(?i)university"
      - "(?i)college"
      - "(?i)school"
      - "(?i)institution"
    answer: "University of Mumbai"

  - id: degree
    match_any:
      - "(?i)degree"
      - "(?i)highest education"
      - "(?i)qualification"
      - "(?i)education level"
    answer: "Bachelor of Technology"

  - id: major
    match_any:
      - "(?i)major"
      - "(?i)field of study"
      - "(?i)specialization"
      - "(?i)branch"
    answer: "Computer Engineering"

  - id: graduation_year
    match_any:
      - "(?i)graduation year"
      - "(?i)expected graduation"
      - "(?i)year of graduation"
      - "(?i)when.*graduat"
    answer: "2027"

  - id: gpa
    match_any:
      - "(?i)gpa"
      - "(?i)cgpa"
      - "(?i)grade"
    answer: "9"

  - id: sponsorship
    match_any:
      - "(?i)sponsor"
      - "(?i)work sponsorship"
      - "(?i)visa sponsorship"
      - "(?i)require sponsorship"
      - "(?i)need sponsorship"
    answer: "{require_sponsorship}"

  - id: linkedin_profile
    match_any:
      - "(?i)^linkedin\\*?$"
      - "(?i)linkedin profile"
      - "(?i)linkedin url"
      - "(?i)profile url"
      - "(?i)link to linkedin"
    answer: "{linkedin_profile_url}"

  - id: current_employer
    match_any:
      - "(?i)current employer"
      - "(?i)current company"
      - "(?i)employer"
      - "(?i)company you work for"
    answer: "Student"

  - id: salutation
    match_any:
      - "(?i)salutation"
      - "(?i)title\\b"
    answer: "Mr."

  - id: github_profile
    match_any:
      - "(?i)github"
      - "(?i)portfolio"
      - "(?i)website"
      - "(?i)personal site"
    answer: "{github_url}"

  - id: country_of_origin
    match_any:
      - "(?i)which country are you from"
      - "(?i)what country are you from"
      - "(?i)country of origin"
      - "(?i)home country"
      - "(?i)country of birth"
      - "(?i)country of residence"
      - "(?i)what is your country"
      - "(?i)which country do you"
    answer: "India"

  - id: nationality
    match_any:
      - "(?i)nationality"
      - "(?i)citizenship(?!.*US)"
    answer: "{nationality}"

  - id: government
    match_any:
      - "(?i)government"
      - "(?i)veteran"
      - "(?i)disability"
    answer: "{government_id}"

  # --- Years of Experience Rules ---

  - id: yoe_ml
    match_any:
      - "(?i)how many years.*(in|with|using|of)\\s+\\b(machine learning|ML)\\b"
      - "(?i)years of experience.*(in|with|using|of)\\s+\\b(machine learning|ML)\\b"
      - "(?i)experience.*(in|with|using)\\s+\\b(machine learning|ML)\\b"
    answer: "{years.machine_learning}"

  - id: yoe_ai
    match_any:
      - "(?i)how many years.*(in|with|using|of)\\s+\\b(AI|artificial intelligence)\\b"
      - "(?i)years of experience.*(in|with|using|of)\\s+\\b(AI|artificial intelligence)\\b"
      - "(?i)experience.*(in|with|using)\\s+\\b(AI|artificial intelligence)\\b"
    answer: "{years.ai_ml}"

  - id: yoe_python
    match_any:
      - "(?i)how many years.*\\bpython\\b"
      - "(?i)years of experience.*\\bpython\\b"
      - "(?i)experience.*\\bpython\\b"
    answer: "{years.python}"

  - id: yoe_sql
    match_any:
      - "(?i)how many years.*\\bSQL\\b"
      - "(?i)years of experience.*\\bSQL\\b"
      - "(?i)experience.*\\bSQL\\b"
    answer: "{years.sql}"

  - id: yoe_javascript
    match_any:
      - "(?i)how many years.*\\b(javascript|JS)\\b"
      - "(?i)years of experience.*\\b(javascript|JS)\\b"
    answer: "{years.javascript}"

  - id: yoe_nodejs
    match_any:
      - "(?i)how many years.*\\b(node|nodejs|node.js)\\b"
      - "(?i)years of experience.*\\b(node|nodejs|node.js)\\b"
    answer: "{years.nodejs}"

  - id: yoe_web
    match_any:
      - "(?i)how many years.*\\b(web development|web dev|frontend|front-end|html|css)\\b"
      - "(?i)years of experience.*\\b(web development|web dev|frontend|front-end|html|css)\\b"
    answer: "{years.web_development}"

  - id: yoe_backend
    match_any:
      - "(?i)how many years.*\\bbackend\\b"
      - "(?i)years of experience.*\\bbackend\\b"
      - "(?i)experience.*\\bbackend\\b"
    answer: "{years.backend}"

  - id: yoe_data_eng
    match_any:
      - "(?i)how many years.*\\b(data engineering|ETL|pipelines|data scraping)\\b"
      - "(?i)years of experience.*\\b(data engineering|ETL|pipelines|data scraping)\\b"
    answer: "{years.data_engineering}"

  - id: yoe_git
    match_any:
      - "(?i)how many years.*\\bgit\\b"
      - "(?i)years of experience.*\\bgit\\b"
    answer: "{years.git}"

  - id: yoe_cybersecurity
    match_any:
      - "(?i)how many years.*\\b(security|cybersecurity|cyber security)\\b"
      - "(?i)years of experience.*\\b(security|cybersecurity|cyber security)\\b"
    answer: "{years.cybersecurity}"

  - id: yoe_leadership
    match_any:
      - "(?i)how many years.*\\b(leadership|management|people management|team lead)\\b"
      - "(?i)years of experience.*\\b(leadership|management|people management|team lead)\\b"
    answer: "{years.leadership}"

  - id: yoe_overall
    match_any:
      - "(?i)\\b(total|overall) (years of )?(work |professional |industry |software )?experience\\b"
      - "(?i)how many years of (total|overall) experience"
      - "(?i)how many years of software (engineering|development) experience"
      - "(?i)total years of (work |professional |industry )?experience"
    answer: "{years.overall_software}"

  - id: yoe_frontend
    match_any:
      - "(?i)how many years.*\\b(frontend|front-end|react|reactjs|vue|angular|ui development)\\b"
      - "(?i)years of experience.*\\b(frontend|front-end|react|reactjs|vue|angular|ui development)\\b"
      - "(?i)experience.*\\b(react|frontend|front-end)\\b"
    answer: "{years.frontend}"

  - id: yoe_fullstack
    match_any:
      - "(?i)how many years.*\\b(full stack|fullstack|full-stack)\\b"
      - "(?i)years of experience.*\\b(full stack|fullstack|full-stack)\\b"
      - "(?i)experience.*\\b(full stack|fullstack|full-stack)\\b"
    answer: "{years.fullstack}"

  - id: yoe_rest_apis
    match_any:
      - "(?i)how many years.*\\b(rest api|restful|api development|fastapi|flask|express)\\b"
      - "(?i)years of experience.*\\b(rest api|restful|api development|fastapi|flask|express)\\b"
      - "(?i)experience.*\\b(rest api|fastapi|flask)\\b"
    answer: "{years.rest_apis}"

  - id: yoe_data_analysis
    match_any:
      - "(?i)how many years.*\\b(data analysis|data analytics|pandas|numpy|eda|business intelligence)\\b"
      - "(?i)years of experience.*\\b(data analysis|data analytics|pandas|numpy|eda|business intelligence)\\b"
      - "(?i)experience.*\\b(pandas|data analysis)\\b"
    answer: "{years.data_analysis}"

  - id: yoe_scraping
    match_any:
      - "(?i)how many years.*\\b(scraping|web scraping|beautifulsoup|bs4|scrapy|crawling)\\b"
      - "(?i)years of experience.*\\b(scraping|web scraping|beautifulsoup|bs4|scrapy|crawling)\\b"
      - "(?i)experience.*\\b(web scraping|scraping|beautifulsoup)\\b"
    answer: "{years.data_scraping}"

  - id: yoe_llm_genai
    match_any:
      - "(?i)how many years.*\\b(genai|generative ai|llm|llms|prompt engineering|langchain|rag)\\b"
      - "(?i)years of experience.*\\b(genai|generative ai|llm|llms|prompt engineering|langchain|rag)\\b"
      - "(?i)experience.*\\b(llm|generative ai|prompt engineering)\\b"
    answer: "{years.llm_genai}"

  - id: yoe_qa_testing
    match_any:
      - "(?i)how many years.*\\b(qa|testing|test automation|pytest|selenium|quality assurance|unit testing)\\b"
      - "(?i)years of experience.*\\b(qa|testing|test automation|pytest|selenium|quality assurance|unit testing)\\b"
      - "(?i)experience.*\\b(testing|test automation|qa|pytest)\\b"
    answer: "{years.testing_qa}"

  - id: yoe_excel
    match_any:
      - "(?i)how many years.*\\b(excel|advanced excel|spreadsheets)\\b"
      - "(?i)years of experience.*\\b(excel|advanced excel|spreadsheets)\\b"
      - "(?i)experience.*\\b(excel|spreadsheets)\\b"
    answer: "{years.excel}"

  - id: yoe_linux
    match_any:
      - "(?i)how many years.*\\b(linux|unix|bash|shell)\\b"
      - "(?i)years of experience.*\\b(linux|unix|bash|shell)\\b"
      - "(?i)experience.*\\b(linux|bash)\\b"
    answer: "{years.linux}"

  - id: yoe_docker
    match_any:
      - "(?i)how many years.*\\b(docker|containers|containerization|aws|cloud)\\b"
      - "(?i)years of experience.*\\b(docker|containers|containerization|aws|cloud)\\b"
      - "(?i)experience.*\\b(docker|cloud)\\b"
    answer: "{years.docker}"

  - id: primary_programming_language
    match_any:
      - "(?i)primary programming language"
      - "(?i)preferred programming language"
      - "(?i)strongest programming language"
      - "(?i)main programming language"
    answer: "Python"

  - id: current_student
    match_any:
      - "(?i)are you currently enrolled"
      - "(?i)current student"
      - "(?i)currently pursuing.*degree"
      - "(?i)are you a student"
    answer: "{yes}"

  - id: internship_availability
    match_any:
      - "(?i)available for.*internship"
      - "(?i)available for.*full-time"
      - "(?i)available for.*full time"
      - "(?i)seeking.*internship"
    answer: "{yes}"

  # --- Other Common Questions ---

  - id: referral_source
    match_any:
      - "(?i)how did you hear"
      - "(?i)how did you find"
      - "(?i)where did you hear"
      - "(?i)how were you referred"
    answer: "LinkedIn"

  - id: start_date
    match_any:
      - "(?i)start date"
      - "(?i)when can you start"
      - "(?i)earliest start"
      - "(?i)available to start"
      - "(?i)date of joining"
    answer: "Immediately"

  - id: notice_period
    match_any:
      - "(?i)notice period"
      - "(?i)how soon can you"
    answer: "Immediately"

  - id: relocation
    match_any:
      - "(?i)willing to relocate"
      - "(?i)open to relocation"
      - "(?i)relocate"
    answer: "{yes}"

  - id: remote_work
    match_any:
      - "(?i)remote"
      - "(?i)work from home"
      - "(?i)hybrid"
    answer: "{yes}"

  - id: cover_letter
    match_any:
      - "(?i)cover letter"
      - "(?i)why.*this (role|position|company)"
      - "(?i)tell us about yourself"
      - "(?i)why should we hire"
    answer: "I am a final-year Computer Engineering student at the University of Mumbai with hands-on experience in software development, data engineering, and cybersecurity through multiple internships and hackathons. I am eager to contribute and learn in a professional environment."

  # --- Generic Yes/No Helpers ---

  - id: can_you
    match_any:
      - "(?i)^can you\\b"
    answer: "{yes}"

  - id: do_you
    match_any:
      - "(?i)^do you\\b"
    answer: "{yes}"

  - id: is_your
    match_any:
      - "(?i)^is your\\b"
      - "(?i)^is the\\b"
    answer: "{yes}"

  - id: have_you
    match_any:
      - "(?i)^have you\\b"
    answer: "{yes}"

  - id: phd_degree
    match_any:
      - "(?i)doctor of philosophy"
      - "(?i)\\bphd\\b"
      - "(?i)doctoral degree"
    answer: "{no}"

  - id: masters_degree
    match_any:
      - "(?i)master's degree"
      - "(?i)masters degree"
      - "(?i)\\bMS\\b"
      - "(?i)\\bM\\.S\\.\\b"
    answer: "{no}"

  - id: bachelors_degree
    match_any:
      - "(?i)bachelor"
      - "(?i)\\bBS\\b"
      - "(?i)\\bB\\.Tech\\b"
      - "(?i)undergraduate"
    answer: "{yes}"

  - id: us_uk_india_resident
    match_any:
      - "(?i)resident of the (us|uk|united states|united kingdom)"
      - "(?i)based in the (us|uk|united states|united kingdom)"
    answer: "{no}"

  - id: india_resident
    match_any:
      - "(?i)resident of.*india"
      - "(?i)based in.*india"
      - "(?i)located in.*india"
    answer: "{yes}"

  - id: are_you
    match_any:
      - "(?i)^are you\\b"
    answer: "{yes}"

  # Auto-learned by AI on 2026-09-01 15:33:58
  - id: ai_i_m_looking_for
    match_any:
      - "(?i)i\u2019m\\ looking\\ for\\.\\.\\."
    answer: "I am seeking an internship in software development, data engineering/analysis, or\
  \ AI/ML."

  # Auto-learned by AI on 2026-09-01 15:42:52
