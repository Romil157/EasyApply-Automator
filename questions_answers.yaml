    answer: "Mr."

  - id: github_profile
    match_any:
      - "(?i)github"
      - "(?i)portfolio"
      - "(?i)website"
      - "(?i)personal site"
    answer: "{github_url}"

  - id: country_of_origin
    match_any:
      - "(?i)which country are you from"
      - "(?i)what country are you from"
      - "(?i)country of origin"
      - "(?i)home country"
      - "(?i)country of birth"
      - "(?i)country of residence"
      - "(?i)what is your country"
      - "(?i)which country do you"
    answer: "India"

  - id: nationality
    match_any:
      - "(?i)nationality"
      - "(?i)citizenship(?!.*US)"
    answer: "{nationality}"

  - id: government
    match_any:
      - "(?i)government"
      - "(?i)veteran"
      - "(?i)disability"
