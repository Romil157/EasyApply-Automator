# ─── EasyApply Automator – Local Answer Profile (gitignored) ───────────────
# This file lives only on your local disk (gitignored). It holds the
# lower-sensitivity profile data that you chose to keep in YAML form:
# years of experience per skill, work-authorization answers, demographics,
# education, cover-letter pitch, etc.
#
# High-sensitivity PII (full name, phone, email, LinkedIn/GitHub URLs) is
# sourced from environment variables (see .env.example) and injected into
# rule answers via {placeholders} like {full_name}, {phone_number}. Leave
# those placeholders in place — the AutoAnswer engine resolves them at
# runtime from your .env. If an env var is missing, the literal {placeholder}
# stays in the answer as a visible signal to the user.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

defaults:
  unknown_years: "0"
  unknown_text: "user provided"
  yes: "Yes"
  no: "No"
  prefer_not: "Wish not to answer"
  no_self_id: "I do not wish to self-identify"

profile:
  years:
    overall_software: "2"
    ai_ml: "1"
    machine_learning: "1"
    deep_learning: "1"
    nlp: "1"
    llm_genai: "1"
    data_science: "1"
    data_engineering: "1"
    data_analysis: "1"
    data_scraping: "2"
    data_cleaning: "2"
    python: "2"
    sql: "2"
    backend: "2"
    frontend: "2"
    fullstack: "2"
    web_development: "2"
    html_css: "2"
    javascript: "2"
    nodejs: "1"
    react: "1"
    flask: "1"
    fastapi: "1"
    rest_apis: "2"
    git: "2"
    cybersecurity: "2"
    siem: "1"
    automation: "2"
    testing_qa: "1"
    technical_support: "1"
    networks: "1"
    excel: "2"
    linux: "2"
    docker: "1"
    leadership: "1"
    seo: "1"
    sem: "1"
    finance: "1"
    financial_analysis: "1"
    investment_banking: "1"

  work_auth:
    us_citizen: "No"
    require_sponsorship: "No"
    legally_authorized: "Yes"
    # LinkedIn profile URL sourced from LINKEDIN_PROFILE_URL env var; leave
    # blank here so the env value is the single source of truth.
    linkedin_profile_url: ""

  demographics:
    gender: "Male"
    race: "Asian"
    ethnicity: "Wish not to answer"
    lgbtq: "Wish not to answer"
    nationality: "Indian"
    government_id: "I do not wish to self-identify"

rules:
  - id: salary
    match_any:
      - "(?i)salary"
      - "(?i)compensation"
      - "(?i)desired salary"
      - "(?i)expected salary"
      - "(?i)base salary"
    answer: "{salary}"

  - id: hourly_rate
    match_any:
      - "(?i)hourly rate"
      - "(?i)rate per hour"
      - "(?i)contract rate"
      - "(?i)consulting rate"
    answer: "{hourly_rate}"

  - id: phone_number
    match_any:
      - "(?i)phone"
      - "(?i)mobile"
      - "(?i)contact number"
    answer: "{phone_number}"

  - id: email
    match_any:
      - "(?i)email"
      - "(?i)e-mail"
    answer: "{form_email}"

  - id: name
    match_any:
      - "(?i)full name"
      - "(?i)your name"
    answer: "{full_name}"

  - id: first_name
    match_any:
      - "(?i)first name"
    answer: "{first_name}"

  - id: last_name
    match_any:
      - "(?i)last name"
      - "(?i)surname"
    answer: "{last_name}"

  - id: city
    match_any:
      - "(?i)city"
      - "(?i)current location"
      - "(?i)where are you located"
      - "(?i)where are you based"
      - "(?i)where.*based"
      - "(?i)currently based"
      - "(?i)what is your location"
      - "(?i)current city"
    answer: "{location_city}"

  - id: address
    match_any:
      - "(?i)address"
      - "(?i)street"
    answer: "Mumbai, Maharashtra, India"

  - id: university
    match_any:
      - "(?i)university"
      - "(?i)college"
      - "(?i)school"
      - "(?i)institution"
    answer: "University of Mumbai"

  - id: degree
    match_any:
      - "(?i)degree"
      - "(?i)highest education"
      - "(?i)qualification"
      - "(?i)education level"
    answer: "Bachelor of Technology"

  - id: major
    match_any:
      - "(?i)major"
      - "(?i)field of study"
      - "(?i)specialization"
      - "(?i)branch"
    answer: "Computer Engineering"

  - id: graduation_year
    match_any:
      - "(?i)graduation year"
      - "(?i)expected graduation"
      - "(?i)year of graduation"
      - "(?i)when.*graduat"
    answer: "2027"

  - id: gpa
    match_any:
      - "(?i)gpa"
      - "(?i)cgpa"
      - "(?i)grade"
    answer: "9"

  - id: sponsorship
    match_any:
      - "(?i)sponsor"
      - "(?i)work sponsorship"
      - "(?i)visa sponsorship"
      - "(?i)require sponsorship"
      - "(?i)need sponsorship"
    answer: "{require_sponsorship}"

  - id: linkedin_profile
    match_any:
      - "(?i)^linkedin\\*?$"
      - "(?i)linkedin profile"
      - "(?i)linkedin url"
      - "(?i)profile url"
      - "(?i)link to linkedin"
    answer: "{linkedin_profile_url}"

  - id: current_employer
    match_any:
      - "(?i)current employer"
      - "(?i)current company"
      - "(?i)employer"
      - "(?i)company you work for"
    answer: "Student"

  - id: salutation
    match_any:
      - "(?i)salutation"
