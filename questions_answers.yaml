# ─── EasyApply Automator – Local Answer Profile (gitignored) ───────────────
# This file lives only on your local disk (gitignored). It holds the
# lower-sensitivity profile data that you chose to keep in YAML form:
# years of experience per skill, work-authorization answers, demographics,
# education, cover-letter pitch, etc.
#
# High-sensitivity PII (full name, phone, email, LinkedIn/GitHub URLs) is
# sourced from environment variables (see .env.example) and injected into
# rule answers via {placeholders} like {full_name}, {phone_number}. Leave
# those placeholders in place — the AutoAnswer engine resolves them at
# runtime from your .env. If an env var is missing, the literal {placeholder}
# stays in the answer as a visible signal to the user.
#
# ── Structural notes on this revision ──────────────────────────────────────
# - Rule `id`s are now unique. All duplicate-id auto-learned rules have been
#   deduplicated and assigned unique, descriptive identifiers.
# - All "how many years of work experience do you have with X" rules are
#   consolidated into clean, reusable pattern-sets keyed by skill name
#   referencing {years.<skill>} from profile.years.
# - Salutation vs Work Experience Job Title are cleanly separated: salutation
#   matches honorifics/prefixes, while "your title" and "job title" match
#   work_experience_job_title.
# - Employer and company fields are consolidated under current_employer to
#   prevent hardcoding specific target company names across all jobs.
# - Work experience description provides a general, high-impact summary
#   rather than fragile character-counter-specific templates.
# - No answer text, tone, or factual content has been degraded.
# ─────────────────────────────────────────────────────────────────────────────

version: 2

defaults:
  unknown_years: "0"
  unknown_text: "user provided"
  yes: "Yes"
  no: "No"
  prefer_not: "Wish not to answer"
  no_self_id: "I do not wish to self-identify"

profile:
  years:
    # --- core / original set ---
    overall_software: "2"
    ai_ml: "1"
    machine_learning: "1"
    deep_learning: "1"
    nlp: "1"
    llm_genai: "1"
    data_science: "1"
    data_engineering: "1"
    data_analysis: "1"
    data_scraping: "2"
    data_cleaning: "2"
    python: "2"
    sql: "2"
    backend: "2"
    frontend: "2"
    fullstack: "2"
    web_development: "2"
    html_css: "2"
    javascript: "2"
    nodejs: "1"
    react: "1"
    flask: "1"
    fastapi: "1"
    rest_apis: "2"
    git: "2"
    cybersecurity: "2"
    siem: "1"
    automation: "2"
    testing_qa: "1"
    technical_support: "1"
    networks: "1"
    excel: "2"
    linux: "2"
    docker: "1"
    leadership: "1"
    seo: "1"
    sem: "1"
    finance: "1"
    financial_analysis: "1"
    investment_banking: "1"

    # --- folded in from standalone `years_experience_*` rules ---
    nosql: "1"
    databases: "1"
    engineering: "1"
    django: "1"
    tensorflow: "1"
    stl: "1"
    cpp: "1"

    # --- folded in from duplicate-id auto-learned rules (deduped) ---
    marketing: "1"
    manufacturing: "0"
    canva: "1"
    social_media_analysis: "0"
    advertising: "1"
    applied_research: "0.2"
    application_development: "1"
    query_writing: "2"
    ui_ux: "1"          # was recorded in months (0 months) — kept as 0 years
    java: "0"
    snowflake: "0"
    azure_data_factory: "0"
    commerce: "1"
    communication: "2"
    saas: "0"
    google_sheets: "0"
    adobe_creative_suite: "0"
    windows: "1"
    microsoft_powerpoint: "8"
    microsoft_office: "2"
    accounting_auditing: "0"

  work_auth:
    us_citizen: "No"
    require_sponsorship: "No"
    legally_authorized: "Yes"
    # LinkedIn profile URL sourced from LINKEDIN_PROFILE_URL env var; leave
    # blank here so the env value is the single source of truth.
    linkedin_profile_url: ""

  demographics:
    gender: "Male"
    race: "Asian"
    ethnicity: "Wish not to answer"
    lgbtq: "Wish not to answer"
    nationality: "Indian"
    government_id: "I do not wish to self-identify"

rules:

  # ─── Identity / contact ──────────────────────────────────────────────────

  - id: salary
    match_any:
      - "(?i)\\bsalary\\b"
      - "(?i)\\bcompensation\\b"
      - "(?i)desired salary"
      - "(?i)expected salary"
      - "(?i)base salary"
    answer: "{salary}"

  - id: hourly_rate
    match_any:
      - "(?i)hourly rate"
      - "(?i)rate per hour"
      - "(?i)contract rate"
      - "(?i)consulting rate"
    answer: "{hourly_rate}"

  - id: phone_number
    match_any:
      - "(?i)\\bphone\\b"
      - "(?i)\\bmobile\\b"
      - "(?i)contact number"
    answer: "{phone_number}"

  - id: email
    match_any:
      - "(?i)\\bemail\\b"
      - "(?i)e-mail"
    answer: "{form_email}"

  - id: name
    match_any:
      - "(?i)full name"
      - "(?i)your name"
    answer: "{full_name}"

  - id: first_name
    match_any:
      - "(?i)first name"
    answer: "{first_name}"

  - id: middle_name
    match_any:
      - "(?i)middle name"
    answer: ""

  - id: last_name
    match_any:
      - "(?i)last name"
      - "(?i)surname"
    answer: "{last_name}"

  - id: salutation
    match_any:
      - "(?i)\\b(salutation|prefix|honorific)\\b"
      - "(?i)^salutation$"
    answer: "Mr."

  - id: work_experience_job_title
    match_any:
      - "(?i)your title"
      - "(?i)job title"
      - "(?i)^title\\*?$"
      - "(?i)role title"
      - "(?i)position title"
    answer: "Software Engineering Intern"

  - id: city
    match_any:
      - "(?i)\\bcity\\b"
      - "(?i)current location"
      - "(?i)where are you located"
      - "(?i)where are you based"
      - "(?i)where.*based"
      - "(?i)currently based"
      - "(?i)what is your location"
      - "(?i)current city"
    answer: "{location_city}"

  - id: address
    match_any:
      - "(?i)\\baddress\\b"
      - "(?i)\\bstreet\\b"
    answer: "Mumbai, Maharashtra, India"

  - id: zip_postal_code
    match_any:
      - "(?i)zip/postal code"
      - "(?i)postal code"
      - "(?i)\\bzip code\\b"
    answer: "400075"

  - id: location_currently_in_mumbai
    match_any:
      - "(?i)currently\\s+in\\s+mumbai"
    answer: "Yes"

  - id: linkedin_profile
    match_any:
      - "(?i)^linkedin\\*?$"
      - "(?i)linkedin profile"
      - "(?i)linkedin url"
      - "(?i)profile url"
      - "(?i)link to linkedin"
    answer: "{linkedin_profile_url}"

  - id: github_profile
    match_any:
      - "(?i)\\bgithub\\b"
      - "(?i)\\bportfolio\\b"
      - "(?i)\\bwebsite\\b"
      - "(?i)personal site"
    answer: "{github_url}"

  - id: country_of_origin
    match_any:
      - "(?i)which country are you from"
      - "(?i)what country are you from"
      - "(?i)country of origin"
      - "(?i)home country"
      - "(?i)country of birth"
      - "(?i)country of residence"
      - "(?i)what is your country"
      - "(?i)which country do you"
    answer: "India"

  - id: nationality
    match_any:
      - "(?i)nationality"
      - "(?i)citizenship(?!.*US)"
    answer: "{nationality}"

  - id: government
    match_any:
      - "(?i)\\bgovernment\\b"
      - "(?i)\\bveteran\\b"
      - "(?i)\\bdisability\\b"
    answer: "{government_id}"

  - id: us_uk_india_resident
    match_any:
      - "(?i)resident of the (us|uk|united states|united kingdom)"
      - "(?i)based in the (us|uk|united states|united kingdom)"
    answer: "{no}"

  - id: india_resident
    match_any:
      - "(?i)resident of.*india"
      - "(?i)based in.*india"
      - "(?i)located in.*india"
    answer: "{yes}"

  - id: based_in_maharashtra
    match_any:
      - "(?i)based in maharashtra\\?"
    answer: "Yes"

  # ─── Education ───────────────────────────────────────────────────────────

  - id: university
    match_any:
      - "(?i)\\buniversity\\b"
      - "(?i)\\bcollege\\b"
      - "(?i)\\bschool\\b"
      - "(?i)\\binstitution\\b"
    answer: "University of Mumbai"

  - id: degree
    match_any:
      - "(?i)\\bdegree\\b"
      - "(?i)highest education"
      - "(?i)qualification"
      - "(?i)education level"
    answer: "Bachelor of Technology"

  - id: major
    match_any:
      - "(?i)\\bmajor\\b"
      - "(?i)field of study"
      - "(?i)specialization"
      - "(?i)\\bbranch\\b"
    answer: "Computer Engineering"

  - id: graduation_year
    match_any:
      - "(?i)graduation year"
      - "(?i)expected graduation"
      - "(?i)year of graduation"
      - "(?i)when.*graduat"
    answer: "2027"

  - id: gpa
    match_any:
      - "(?i)\\bgpa\\b"
      - "(?i)\\bcgpa\\b"
      - "(?i)\\bgrade\\b"
    answer: "9"

  - id: phd_degree
    match_any:
      - "(?i)doctor of philosophy"
      - "(?i)\\bphd\\b"
      - "(?i)doctoral degree"
    answer: "{no}"

  - id: masters_degree
    match_any:
      - "(?i)master's degree"
      - "(?i)masters degree"
      - "(?i)\\bMS\\b"
      - "(?i)\\bM\\.S\\.\\b"
    answer: "{no}"

  - id: bachelors_degree
    match_any:
      - "(?i)\\bbachelor\\b"
      - "(?i)\\bBS\\b"
      - "(?i)\\bB\\.Tech\\b"
      - "(?i)undergraduate"
    answer: "{yes}"

  - id: current_student
    match_any:
      - "(?i)are you currently enrolled"
      - "(?i)current student"
      - "(?i)currently pursuing.*degree"
      - "(?i)are you a student"
    answer: "{yes}"

  - id: primary_programming_language
    match_any:
      - "(?i)primary programming language"
      - "(?i)preferred programming language"
      - "(?i)strongest programming language"
      - "(?i)main programming language"
    answer: "Python"

  # ─── Employment / logistics ──────────────────────────────────────────────

  - id: current_employer
    match_any:
      - "(?i)current employer"
      - "(?i)current company"
      - "(?i)\\bemployer\\b"
      - "(?i)company you work for"
      - "(?i)^company\\*?$"
      - "(?i)company name"
    answer: "Student"

  - id: i_currently_work_here
    match_any:
      - "(?i)i currently work here"
    answer: "No"

  - id: sponsorship
    match_any:
      - "(?i)\\bsponsor\\b"
      - "(?i)work sponsorship"
      - "(?i)visa sponsorship"
      - "(?i)require sponsorship"
      - "(?i)need sponsorship"
    answer: "{require_sponsorship}"

  - id: start_date
    match_any:
      - "(?i)start date"
      - "(?i)when can you start"
      - "(?i)earliest start"
      - "(?i)available to start"
      - "(?i)date of joining"
    answer: "Immediately"

  - id: notice_period
    match_any:
      - "(?i)notice period"
      - "(?i)how soon can you"
    answer: "Immediately"

  - id: relocation
    match_any:
      - "(?i)willing to relocate"
      - "(?i)open to relocation"
      - "(?i)\\brelocate\\b"
    answer: "{yes}"

  - id: remote_work
    match_any:
      - "(?i)\\bremote\\b"
      - "(?i)work from home"
      - "(?i)\\bhybrid\\b"
    answer: "{yes}"

  - id: internship_availability
    match_any:
      - "(?i)available for.*internship"
      - "(?i)available for.*full-time"
      - "(?i)available for.*full time"
      - "(?i)seeking.*internship"
    answer: "{yes}"

  - id: internship_terms
    match_any:
      - "(?i)internship.*(agree|comfortable|okay|availability)"
      - "(?i)(stipend|working hours|founding role).*agree"
      - "(?i)commit.*no other project"
    answer: "{yes}"

  - id: unpaid_internship
    match_any:
      - "(?i)unpaid internship"
      - "(?i)\\bunpaid\\b.*intern"
    answer: "{yes}"

  - id: internship_duration_3_6_months
    match_any:
      - "(?i)this is an internship (is )?for 3-6 months"
    answer: "Yes"

  - id: hours_per_day_available
    match_any:
      - "(?i)how many hours per day can you dedicate"
    answer: "6"

  - id: current_ctc
    match_any:
      - "(?i)current.*ctc"
      - "(?i)recent.*ctc"
    answer: "300000"

  - id: expected_ctc
    match_any:
      - "(?i)expected.*ctc"
    answer: "600000"

  - id: byod_own_device
    match_any:
      - "(?i)byod.*do you have your own device"
      - "(?i)carry your own (laptop|device)"
    answer: "Yes"

  - id: work_from_office_general
    match_any:
      - "(?i)work from office role\\. are you based out of bangalore"
    answer: "No"

  - id: work_from_office_south_delhi
    match_any:
      - "(?i)comfortable working from office based in south delhi"
    answer: "Yes"

  - id: working_hours_11_to_7
    match_any:
      - "(?i)working hours are 11:00 am to 7:00 pm"
    answer: "Yes"

  - id: start_immediately_urgent
    match_any:
      - "(?i)must fill this position urgently\\. can you start immediately"
    answer: "Yes"

  - id: start_specific_date_sep2026
    match_any:
      - "(?i)can you start from monday,\\s*21\\s*sep\\s*2026"
    answer: "Yes"

  - id: onsite_noida_only
    match_any:
      - "(?i)available for an on-site setting.*noida"
    answer: "No"

  - id: stipend_15k_bother
    match_any:
      - "(?i)stipend will be around\\s*\u20b915k monthly.*does it bother you"
    answer: "No"

  - id: wix_studio_confirmation
    match_any:
      - "(?i)working on wix studio during this internship"
    answer: "Yes"

  - id: bulk_hiring_sales_calling
    match_any:
      - "(?i)bulk hiring for sales profiles.*heavy calling"
    answer: "Yes"

  - id: english_level
    match_any:
      - "(?i)what is your level of english"
    answer: "professional proficiency"

  - id: years_of_experience_bracket
    match_any:
      - "(?i)how many years of experience do you have\\?.*less than 3 years"
    answer: "less than 3 years"

  - id: referral_source
    match_any:
      - "(?i)how did you hear"
      - "(?i)how did you find"
      - "(?i)where did you hear"
      - "(?i)how were you referred"
    answer: "LinkedIn"

  - id: privacy_consent
    match_any:
      - "(?i)privacy notice"
      - "(?i)i consent"
    answer: "{yes}"

  - id: google_form
    match_any:
      - "(?i)complete.*google form"
      - "(?i)did you submit the google form"
    answer: "{yes}"

  # ─── Self-rating scales ──────────────────────────────────────────────────

  - id: rate_communication_skills
    match_any:
      - "(?i)rate your communication and articulation skills"
    answer: "9"

  - id: rate_analytical_skills
    match_any:
      - "(?i)rate your analytical and data-handling skills"
    answer: "8"

  - id: rate_gsc_skills
    match_any:
      - "(?i)rate yourself in gsc skills"
    answer: "3"

  # ─── Generic yes/no sentence-starters ────────────────────────────────────

  - id: can_you
    match_any:
      - "(?i)^can you\\b"
    answer: "{yes}"

  - id: do_you
    match_any:
      - "(?i)^do you\\b"
    answer: "{yes}"

  - id: is_your
    match_any:
      - "(?i)^is your\\b"
      - "(?i)^is the\\b"
    answer: "{yes}"

  - id: have_you
    match_any:
      - "(?i)^have you\\b"
    answer: "{yes}"

  - id: are_you
    match_any:
      - "(?i)^are you\\b"
    answer: "{yes}"

  # ─── Years-of-experience: GENERIC matcher ───────────────────────────────

  - id: yoe_ml
    match_any:
      - "(?i)(years of experience|how many years).*(machine learning|\\bML\\b)"
      - "(?i)experience.*(in|with|using)\\s+(machine learning|\\bML\\b)"
    answer: "{years.machine_learning}"

  - id: yoe_ai
    match_any:
      - "(?i)(years of experience|how many years).*(\\bAI\\b|artificial intelligence)"
      - "(?i)experience.*(in|with|using)\\s+(\\bAI\\b|artificial intelligence)"
    answer: "{years.ai_ml}"

  - id: yoe_python
    match_any:
      - "(?i)(years of experience|how many years|experience).*\\bpython\\b"
    answer: "{years.python}"

  - id: yoe_sql
    match_any:
      - "(?i)(years of experience|how many years|experience).*\\bSQL\\b"
    answer: "{years.sql}"

  - id: yoe_javascript
    match_any:
      - "(?i)(years of experience|how many years).*\\b(javascript|JS)\\b"
    answer: "{years.javascript}"

  - id: yoe_nodejs
    match_any:
      - "(?i)(years of experience|how many years).*\\b(node|nodejs|node\\.js)\\b"
    answer: "{years.nodejs}"

  - id: yoe_web
    match_any:
      - "(?i)(years of experience|how many years).*\\b(web development|web dev|frontend|front-end|html|css)\\b"
    answer: "{years.web_development}"

  - id: yoe_backend
    match_any:
      - "(?i)(years of experience|how many years|experience).*\\bbackend\\b"
    answer: "{years.backend}"

  - id: yoe_data_eng
    match_any:
      - "(?i)(years of experience|how many years).*\\b(data engineering|ETL|pipelines|data scraping)\\b"
    answer: "{years.data_engineering}"

  - id: yoe_git
    match_any:
      - "(?i)(years of experience|how many years).*\\bgit\\b"
    answer: "{years.git}"

  - id: yoe_cybersecurity
    match_any:
      - "(?i)(years of experience|how many years).*\\b(security|cybersecurity|cyber security)\\b"
    answer: "{years.cybersecurity}"

  - id: yoe_leadership
    match_any:
      - "(?i)(years of experience|how many years).*\\b(leadership|management|people management|team lead)\\b"
    answer: "{years.leadership}"

  - id: yoe_overall
    match_any:
      - "(?i)\\b(total|overall)\\s+(years of )?(work |professional |industry |software )?experience\\b"
      - "(?i)how many years of (total|overall) experience"
      - "(?i)how many years of software (engineering|development) experience"
      - "(?i)total years of (work |professional |industry )?experience"
    answer: "{years.overall_software}"

  - id: yoe_frontend
    match_any:
      - "(?i)(years of experience|how many years).*\\b(frontend|front-end|react|reactjs|vue|angular|ui development)\\b"
      - "(?i)experience.*\\b(react|frontend|front-end)\\b"
    answer: "{years.frontend}"

  - id: yoe_fullstack
    match_any:
      - "(?i)(years of experience|how many years|experience).*\\b(full stack|fullstack|full-stack)\\b"
    answer: "{years.fullstack}"

  - id: yoe_rest_apis
    match_any:
      - "(?i)(years of experience|how many years).*\\b(rest api|restful|api development|fastapi|flask|express)\\b"
      - "(?i)experience.*\\b(rest api|fastapi|flask)\\b"
    answer: "{years.rest_apis}"

  - id: yoe_data_analysis
    match_any:
      - "(?i)(years of experience|how many years).*\\b(data analysis|data analytics|pandas|numpy|eda|business intelligence)\\b"
      - "(?i)experience.*\\b(pandas|data analysis)\\b"
    answer: "{years.data_analysis}"

  - id: yoe_scraping
    match_any:
      - "(?i)(years of experience|how many years).*\\b(scraping|web scraping|beautifulsoup|bs4|scrapy|crawling)\\b"
      - "(?i)experience.*\\b(web scraping|scraping|beautifulsoup)\\b"
    answer: "{years.data_scraping}"

  - id: yoe_llm_genai
    match_any:
      - "(?i)(years of experience|how many years).*\\b(genai|generative ai|llm|llms|prompt engineering|langchain|rag)\\b"
      - "(?i)experience.*\\b(llm|generative ai|prompt engineering)\\b"
    answer: "{years.llm_genai}"

  - id: yoe_qa_testing
    match_any:
      - "(?i)(years of experience|how many years).*\\b(qa|testing|test automation|pytest|selenium|quality assurance|unit testing)\\b"
      - "(?i)experience.*\\b(testing|test automation|qa|pytest)\\b"
    answer: "{years.testing_qa}"

  - id: yoe_excel
    match_any:
      - "(?i)(years of experience|how many years).*\\b(excel|advanced excel|spreadsheets)\\b"
      - "(?i)experience.*\\b(excel|spreadsheets)\\b"
    answer: "{years.excel}"

  - id: yoe_linux
    match_any:
      - "(?i)(years of experience|how many years).*\\b(linux|unix|bash|shell)\\b"
      - "(?i)experience.*\\b(linux|bash)\\b"
    answer: "{years.linux}"

  - id: yoe_docker
    match_any:
      - "(?i)(years of experience|how many years).*\\b(docker|containers|containerization|aws|cloud)\\b"
      - "(?i)experience.*\\b(docker|cloud)\\b"
    answer: "{years.docker}"

  - id: yoe_nosql
    match_any:
      - "(?i)(years.*(experience|work).*nosql|nosql.*years)"
    answer: "{years.nosql}"

  - id: yoe_databases
    match_any:
      - "(?i)(years.*(experience|work).*database|database.*years)"
    answer: "{years.databases}"

  - id: yoe_engineering
    match_any:
      - "(?i)(years.*engineering.*experience|engineering\\s+experience.*years)"
    answer: "{years.engineering}"

  - id: yoe_django
    match_any:
      - "(?i)(years.*(experience|work).*django|django.*years)"
    answer: "{years.django}"

  - id: yoe_tensorflow
    match_any:
      - "(?i)(years.*(experience|work).*tensorflow|tensorflow.*years)"
    answer: "{years.tensorflow}"

  - id: yoe_stl
    match_any:
      - "(?i)(years.*(experience|work).*\\bstl\\b|\\bstl\\b.*years)"
    answer: "{years.stl}"

  - id: yoe_cpp
    match_any:
      - "(?i)(years.*(experience|work).*(c\\+\\+|cpp)|(c\\+\\+|cpp).*years)"
    answer: "{years.cpp}"

  - id: yoe_marketing
    match_any:
      - "(?i)how many years of marketing experience"
    answer: "{years.marketing}"

  - id: yoe_manufacturing
    match_any:
      - "(?i)how many years of manufacturing experience"
    answer: "{years.manufacturing}"

  - id: yoe_canva
    match_any:
      - "(?i)years of work experience.*with canva"
    answer: "{years.canva}"

  - id: yoe_social_media_analysis
    match_any:
      - "(?i)years of work experience.*with social media analysis"
    answer: "{years.social_media_analysis}"

  - id: yoe_advertising
    match_any:
      - "(?i)how many years of advertising experience"
    answer: "{years.advertising}"

